name: collect

# F1/F8/F2/F4 파이프라인 오케스트레이션 — 수집 → 타임라인 → 집계 → ddragon → 매칭 → (선택)디스코드
# → data/aggregated·public/dd·data/ddragon 변경분 커밋·푸시.
#
# 트리거:
#   - workflow_dispatch: 수동 실행(백업·재개·임의 패치 재처리). 모든 입력이 optional — 비우면
#     schedule과 동일하게 PATCH_CALENDAR 기반 자동 판정을 탄다.
#   - schedule: 매주 목요일 00:00 UTC. 이 프로젝트가 관측한 패치 라이브 요일이 전부 KST 목요일이라
#     (26.16~26.19, src/pipeline/collect/patch-calendar.ts PATCH_CALENDAR 실측) 잡아둔 고정 cron —
#     실제로 "오늘 라이브하는 신규 패치가 캘린더에 있는지"는 `determine` 스텝이 매번 재판정한다.
#     캘린더에 없는 주(=아직 다음 패치가 미확정)에는 determine이 should_run=false로 no-op 종료한다.
#
# 리밋 근거(RESEARCH §2-5): GitHub Actions job 최대 6h, private repo 무료 2,000분/월. 1만 매치
# 수집=약 3.3h(SCOPE §4) + 타임라인 표본 + 집계·매칭을 합쳐도 6h 안에 들어오지만 여유를 위해
# timeout-minutes를 350(5h50m)으로 둔다. Vercel Cron(Hobby, 60~300s 함수)은 이 길이의 배치에
# 원천적으로 부적합해 후보에서 제외했다(RESEARCH §2-5).
#
# 필요 secrets(Settings → Secrets and variables → Actions → Secrets): RIOT_API_KEY(필수),
# ANTHROPIC_API_KEY(선택 — 없으면 run-match.ts가 LLM 2단을 캐시 폴백/스킵), DISCORD_WEBHOOK_URL
# (선택 — 없으면 Discord briefing 스텝 자체를 건너뜀).
# 필요 variables(Settings → Secrets and variables → Actions → Variables): PATCHGAP_SITE_URL —
# **Vercel 배포 URL이 확정된 뒤에는 반드시 등록한다.** 미등록 상태로는 run-notify.ts가 자체
# 자리표시 기본값(DEFAULT_SITE_URL="https://patchgap.vercel.app")으로 브리핑 embed 링크를
# 만들어 실제 배포 도메인과 어긋날 수 있다(R5 — 배포 전엔 optional, 배포 후엔 required).

on:
  workflow_dispatch:
    inputs:
      patch:
        description: "수집할 패치 ID(예: 26.19). 비우면 오늘(KST) PATCH_CALENDAR 라이브일로 자동 판정한다."
        required: false
        type: string
      target:
        description: "패치당 상세 매치 수집 목표(run-collect --target)"
        required: false
        default: "10000"
        type: string
      timeline_sample:
        description: "타임라인 표본 수(run-timeline --sample)"
        required: false
        default: "1500"
        type: string
      from:
        description: "매칭 기준 이전 패치(run-match --from). 비우면 캘린더상 patch 직전 등록 패치를 쓴다."
        required: false
        type: string
      to:
        description: "매칭 대상 패치(run-match --to). 비우면 patch와 동일하게 취급한다."
        required: false
        type: string
      llm_max:
        # 120 → 400 (2026-09-18): 상한은 **천장이지 목표가 아니다** — 후보가 상한보다 적으면
        # 호출 수도 비용도 그대로다(26.17→26.18: 후보 113, calls 113). 문제는 반대쪽이었다:
        # 26.16→26.17은 후보 244건인데 상한 120이 걸려 **124건이 LLM을 아예 거치지 못했다**
        # (원인 보유 117/244). 후보 수가 패치마다 113↔244로 두 배 넘게 흔들리므로(공지-불일치
        # 64↔208) 120은 큰 패치에서 조용히 커버리지를 깎는다 — 실패가 아니라 설계된 절단이라
        # 경보도 안 울린다. 관측 최대 244에 여유를 둔 400으로 전수를 보장하고, 예산 폭주 가드
        # (이상 입력에서 1,951행 전량 호출)는 그대로 남긴다. SCOPE §3 선행 갱신 완료.
        # 50 → 120 (2026-09-17): 실측 후보가 113건(미공지 47 + 간접 2 + 공지-불일치 64)인데
        # 상한이 50이라 **미공지 14건이 LLM을 아예 거치지 못했다**. 그 행들은 화면에서
        # "근거 미확인"으로 보였지만 실제로는 "검토하지 않음"이었다 — 사용자가 "미공지 Gap의
        # 데이터가 대부분 근거 미확인"이라고 읽은 원인의 한 축이다(나머지 축은 문구였다).
        # 캐시 보존과 함께 가야 의미가 있다: 캐시가 살아 있으면 다음 실행의 실제 호출은
        # 새 델타에만 든다.
        description: "LLM 2단 매칭 세션 상한(run-match --llm-max)"
        required: false
        default: "400"
        type: string
      max_minutes:
        # 수집 스텝 시간 상한. 잡 timeout(350분)에서 수집 뒤 단계 실측치(타임라인 30분 +
        # 집계·ddragon·매칭·브리핑 ≈25분, 26.19 첫 실행)와 여유를 뺀 값이다. 이걸 넘기면
        # 잡이 timeout으로 죽어 받은 매치가 전부 사라진다.
        description: "수집 시간 상한(분) — 목표 미달이어도 여기서 멈추고 집계·커밋으로 넘어간다"
        required: false
        default: "240"
        type: string
      force:
        description: "true면 data/aggregated/{patch}/summary.json이 이미 있어도 재실행한다(재수집·재집계 강제)"
        required: false
        default: "false"
        type: boolean

  schedule:
    # **매일** 00:00 UTC(09:00 KST). 주 1회 고정 요일(목)에서 바뀌었다(2026-09-21) — 세 게임을
    # 같은 주기로 돌리기 위해서다. `determine`이 싸고(파일 확인 + 캘린더 조회) 조건이 아니면
    # 그 자리에서 no-op으로 끝난다(실측 0분). 공개 저장소라 Actions 분이 무료다.
    #
    # ⚠️ **매일이 재시도를 뜻하지는 않는다.** 판정은 `liveKst === 오늘`이라, 라이브일 실행이
    # 세 시간째에 죽으면 다음 날 실행은 캘린더에 오늘이 없어 no-op으로 끝난다. 그 경우는
    # `gh workflow run collect.yml -f patch=… -f force=true`로 사람이 다시 걸어야 한다.
    - cron: "0 0 * * *"

# 동시 실행 방지 — 같은 워크플로우가 겹쳐 돌면 data/raw 캐시·git push가 충돌한다. 예약 실행 중
# 수동 백업 실행을 걸면 앞선 실행이 끝날 때까지 대기시킨다(취소하지 않음 — 진행 중인 3시간대
# 수집을 잃지 않기 위해 cancel-in-progress: false).
concurrency:
  group: patchgap-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # **시크릿 값은 job-level에 두지 않는다**(2026-09-21 security-auditor Warning — collect-tft·
      # collect-pubg는 그때 내렸고 이 파일만 남아 있었다). job-level env는 `npm ci`를 포함한 모든
      # 스텝에 상속된다 — 의존성의 postinstall 스크립트가 키를 읽을 수 있는 자리다. 값은 그 값을
      # 실제로 쓰는 스텝의 `env:`에만 내린다(수집·타임라인=RIOT, 매칭=ANTHROPIC, 디스코드 2곳).
      #
      # 여기 남는 것은 **존재 여부 불리언**뿐이다. 스텝 `if:`는 `secrets`를 못 읽고 `env`는 읽는다.
      # 값이 문자열 "true"/"false"라 시크릿이 아니다. LoL 채널은 `DISCORD_WEBHOOK_URL_LOL`, 없으면
      # 레거시 `DISCORD_WEBHOOK_URL`로 폴백한다(src/pipeline/discord/targets.ts) — 예전 조건은
      # 레거시 쪽만 봐서 LoL 전용 URL만 등록된 경우 브리핑을 건너뛰었다.
      HAS_DISCORD_LOL: ${{ secrets.DISCORD_WEBHOOK_URL_LOL != '' || secrets.DISCORD_WEBHOOK_URL != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 판정 규칙은 `src/pipeline/collect/patch-calendar.ts`의 `determineLolRun`(순수 함수·단위
      # 테스트), 진입점은 `scripts/lol-determine.ts`다. 2026-09-21까지 이 자리에는 heredoc으로
      # 임시 .ts를 만들어 돌리는 블록이 있었는데, 그러면 tsc·eslint·vitest 어느 게이트도 그
      # 코드를 보지 못한다 — 수집 실행 여부를 정하는 코드가 검증 밖에 있었다(TFT·PUBG는 처음부터
      # 실파일이라 테스트가 있다). 실파일로 옮기면서 동작 등가를 테스트가 붙잡는다.
      - name: Determine patch (캘린더 자동 판정 + 중복 실행 가드)
        id: determine
        env:
          MANUAL_PATCH: ${{ github.event.inputs.patch }}
          MANUAL_FROM: ${{ github.event.inputs.from }}
          MANUAL_TO: ${{ github.event.inputs.to }}
          MANUAL_FORCE: ${{ github.event.inputs.force }}
        run: npx tsx scripts/lol-determine.ts

      - name: Restore data/raw (재개용 — 실패·재실행 시 이미 받은 매치는 다시 받지 않는다)
        if: steps.determine.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: data/raw
          key: patchgap-raw-${{ steps.determine.outputs.patch }}-${{ github.run_id }}
          restore-keys: |
            patchgap-raw-${{ steps.determine.outputs.patch }}-

      - name: Restore data/cache/llm (LLM 2단 파일 캐시)
        # **없으면 CI가 매 실행 콜드캐시로 돈다**(2026-09-17 실측): 26.17→26.18 델타의
        # `meta.llm`이 `calls:50, cacheHits:0`인데 그 실행이 남긴 캐시 파일은 0건이었다 —
        # 즉 매 실행이 같은 델타에 예산을 다시 쓰고, 그 결과를 커밋 없이 버렸다. 실제 피해는
        # 예산 낭비만이 아니다: 같은 입력에 대해 low-confidence 후보가 재현되지 않아
        # (실측 6건) 같은 델타의 "추정 원인"이 실행마다 나타났다 사라졌다 한다.
        # `data/cache/`는 gitignore라 저장소로는 보존되지 않으므로 여기서 보존해야 한다.
        if: steps.determine.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: data/cache/llm
          key: patchgap-llm-${{ steps.determine.outputs.to }}-${{ github.run_id }}
          restore-keys: |
            patchgap-llm-${{ steps.determine.outputs.to }}-
            patchgap-llm-

      - name: Collect matches (F1)
        if: steps.determine.outputs.should_run == 'true'
        env:
          PATCH: ${{ steps.determine.outputs.patch }}
          TARGET: ${{ github.event.inputs.target || '10000' }}
          MAX_MINUTES: ${{ github.event.inputs.max_minutes || '240' }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          npx tsx scripts/run-collect.ts \
            --patch "$PATCH" \
            --target "$TARGET" \
            --max-minutes "$MAX_MINUTES"

      # 수집 직후 data/raw를 **무조건** 저장한다. actions/cache의 자동 저장(post 스텝)은 잡이
      # 성공해야만 돈다 — 26.19 첫 실행은 커밋에서 실패해 캐시가 0건이었고, 재실행이 "재개"가
      # 아니라 0부터였다(2026-09-24 실측, `gh cache list`). 키는 복원 스텝과 같다: 잡이 성공하면
      # post 스텝이 같은 키로 한 번 더 저장하려다 "이미 있음"으로 건너뛴다(무해).
      - name: Save data/raw (실패해도 재개 가능하게)
        if: always() && steps.determine.outputs.should_run == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: patchgap-raw-${{ steps.determine.outputs.patch }}-${{ github.run_id }}

      - name: Collect timeline sample (F8)
        if: steps.determine.outputs.should_run == 'true'
        env:
          PATCH: ${{ steps.determine.outputs.patch }}
          TIMELINE_SAMPLE: ${{ github.event.inputs.timeline_sample || '1500' }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          npx tsx scripts/run-timeline.ts \
            --patch "$PATCH" \
            --sample "$TIMELINE_SAMPLE"

      - name: Aggregate (F2/F8)
        if: steps.determine.outputs.should_run == 'true'
        env:
          PATCH_TO: ${{ steps.determine.outputs.to }}
        run: |
          # from 패치는 이 워크플로우가 자동화되기 전(로컬/도그푸딩) 이미 집계·커밋된 상태를
          # 전제한다(SCOPE §3 "로컬(초기·도그푸딩) → GH Actions cron(9/19~)") — data/raw가 로컬
          # 전용(gitignore)이라 여기서 from을 재집계하려 해도 원본이 없다. 오늘 새로 수집한
          # to 패치만 집계한다.
          npx tsx scripts/run-aggregate.ts --patch "$PATCH_TO"

      - name: Update Data Dragon assets
        if: steps.determine.outputs.should_run == 'true'
        run: npx tsx scripts/run-ddragon.ts

      # 표본 경보 — **막지 않는다. 알리기만 한다.**
      #
      # 예전엔 5,000 미만이면 매칭·브리핑·커밋을 통째로 보류했다(9/10 26.18 n=737 선례, ST-6).
      # 두 가지가 틀렸다:
      #  ① 선언 축까지 막았다. 패치노트 최신화는 표본과 무관하게 기본이고, 관측은 그 위에 얹는
      #    부가다(사용자 확정 2026-09-24). 관측을 거르는 일은 이미 **개체 단위** 게이트가 한다 —
      #    승률 n<200이면 `insufficient-sample`(src/pipeline/match/verdict.ts). 전체 차단은 그 위에
      #    얹힌 중복이었고, 비용은 선언 축이 치렀다.
      #  ② 한 번도 작동하지 않았다. `summary.json`의 `.nMatches`를 읽었는데 실제 필드는
      #    `.meta.nMatches`라 N이 `undefined`였고, `[ undefined -lt 5000 ]`이 에러로 else에 빠져
      #    항상 통과했다. 26.19(3,871매치)가 반영된 건 이 버그 덕이었다 — 필드만 고쳤다면 26.19는
      #    통째로 보류됐다.
      # 그래서 읽기가 실패하면 조용히 넘어가지 않고 스텝을 깨뜨린다(숫자가 아니면 exit 1).
      - name: Sample size alert
        id: sample_guard
        if: steps.determine.outputs.should_run == 'true'
        env:
          PATCH_TO: ${{ steps.determine.outputs.to }}
        run: |
          # PATCH_TO를 JS 문자열 리터럴에 직접 꿰매지 않는다 — workflow_dispatch 수동 입력
          # (patch/to)에서 유래할 수 있어 작은따옴표 포함 값이 들어오면 리터럴을 탈출해
          # contents:write 권한 컨텍스트에서 임의 코드가 실행될 수 있다(security-auditor
          # 2026-09-17 지적). process.env로 넘겨 값이 코드로 해석되지 않게 한다.
          N=$(node -e "console.log(JSON.parse(require('fs').readFileSync(\`data/aggregated/\${process.env.PATCH_TO}/summary.json\`,'utf8')).meta.nMatches)")
          echo "[sample_guard] patch=${PATCH_TO} nMatches=${N}"
          if ! [[ "$N" =~ ^[0-9]+$ ]]; then
            echo "::error::summary.json meta.nMatches를 숫자로 읽지 못했다(got '${N}')"
            exit 1
          fi
          if [ "$N" -lt 5000 ]; then
            echo "sample_thin=true" >> "$GITHUB_OUTPUT"
            echo "::warning::patch=${PATCH_TO} nMatches=${N} < 5000 — 관측 축이 얇다. 선언 축은 그대로 반영하고, 개체별 승률은 n<200이면 insufficient-sample로 떨어진다. 보강: gh workflow run collect.yml -f patch=${PATCH_TO} -f force=true"
          else
            echo "sample_thin=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Match + verdict (F3/F4, LLM 2단 포함)
        if: steps.determine.outputs.should_run == 'true'
        env:
          PATCH_FROM: ${{ steps.determine.outputs.from }}
          PATCH_TO: ${{ steps.determine.outputs.to }}
          LLM_MAX: ${{ github.event.inputs.llm_max || '400' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx tsx scripts/run-match.ts \
            --from "$PATCH_FROM" \
            --to "$PATCH_TO" \
            --llm-max "$LLM_MAX"

      # 수치 축(F9) — 게임사가 배포한 **원본 수치**를 패치 간 대조해 패치노트에 없는 변경을 찾는다.
      # 지표 축(위 Match + verdict)과 직교하고 산출물도 섞지 않는다(`data/aggregated/gamedata/lol`).
      #
      # **자리와 continue-on-error가 둘 다 의도적이다.** 여기보다 앞이면 안 된다 — 이 단계가 읽는
      # `data/aggregated/notes/{to}.json`을 `run-match.ts`가 만든다(없으면 라이브 fetch 후 저장).
      # 그리고 이 단계가 깨져도 26.19 수집·판정·브리핑·커밋은 그대로 가야 한다: 잠수함은 **있으면
      # 더 보여주는** 축이라 판정 파이프라인을 막을 이유가 없고, 9/24 무인 실행이 예선 심사
      # 기간(9/21~10/5) 안에 있다. 실패하면 로그에 빨갛게 남고 그 패치의 잠수함 섹션만 빈다.
      #
      # 버전 인자를 주지 않는다 — 직전 쌍 산출물의 `meta.source.to`와 방금 받은 DDragon 최신에서
      # 스스로 찾는다(scripts/shared/snapshot-version.ts).
      - name: Detect submarine patches (F9)
        if: steps.determine.outputs.should_run == 'true'
        env:
          PATCH_FROM: ${{ steps.determine.outputs.from }}
          PATCH_TO: ${{ steps.determine.outputs.to }}
        run: |
          npx tsx scripts/run-gamedata-diff.ts \
            --game lol \
            --from "$PATCH_FROM" \
            --to "$PATCH_TO"
        continue-on-error: true

      - name: Discord thin-sample alert (표본 얇음 — 브리핑과 함께 보낸다)
        if: steps.determine.outputs.should_run == 'true' && steps.sample_guard.outputs.sample_thin == 'true' && env.HAS_DISCORD_LOL == 'true'
        env:
          PATCH_TO: ${{ steps.determine.outputs.to }}
          DISCORD_WEBHOOK_URL_LOL: ${{ secrets.DISCORD_WEBHOOK_URL_LOL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # PATCH_TO를 JSON 문자열에 수동 이스케이프로 꿰매지 않는다 — 값에 "가 섞이면
          # 페이로드가 깨진다(security-auditor 2026-09-17 지적, Info). node -e가
          # JSON.stringify로 만들게 해 이스케이프를 위임한다.
          URL="${DISCORD_WEBHOOK_URL_LOL:-$DISCORD_WEBHOOK_URL}"
          BODY=$(PATCH_TO="$PATCH_TO" node -e "console.log(JSON.stringify({content: \`⚠️ patchgap collect: \${process.env.PATCH_TO} 표본이 얇습니다(5,000 미만). 패치노트는 반영했고, 표본이 모자란 승률은 판정 유보로 표시됩니다. 보강하려면 \\\`gh workflow run collect.yml -f patch=\${process.env.PATCH_TO} -f force=true\\\`\`}))")
          curl -sf -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "$BODY"
        continue-on-error: true

      - name: Discord briefing (F6, 웹훅 시크릿이 있을 때만)
        if: steps.determine.outputs.should_run == 'true' && env.HAS_DISCORD_LOL == 'true'
        # run-notify.ts CLI 인자(--from --to --top --site)는 이제 확정된 시그니처다(scripts/run-notify.ts
        # 실물 확인). `--site`는 **미지정 시 스크립트 자체 기본값**(DEFAULT_SITE_URL,
        # https://patchgap.vercel.app 자리표시)을 쓰고, 지정하려면 http(s):// 스킴에 non-empty
        # 문자열이어야 한다(빈 문자열을 넘기면 parseArgs가 즉시 throw) — 그래서 SITE_URL이 비어
        # 있으면 `--site` 플래그 자체를 아예 넣지 않는다(빈 문자열을 강제로 넘겨 상대경로 링크가
        # 되거나 조기 실패하는 결함 방지, R5). 실제 배포 도메인이 정해지면 저장소 Variables에
        # PATCHGAP_SITE_URL을 등록해야 브리핑 embed가 정확한 절대 URL을 가리킨다 — README
        # "필요 secrets·variables" 표에 "배포 후 필수"로 명시.
        env:
          SITE_URL: ${{ vars.PATCHGAP_SITE_URL }}
          DISCORD_WEBHOOK_URL_LOL: ${{ secrets.DISCORD_WEBHOOK_URL_LOL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID_LOL: ${{ secrets.DISCORD_ROLE_ID_LOL }}
          PATCH_FROM: ${{ steps.determine.outputs.from }}
          PATCH_TO: ${{ steps.determine.outputs.to }}
        run: |
          set -e
          SITE_ARGS=()
          if [[ -n "${SITE_URL}" ]]; then
            SITE_ARGS=(--site "${SITE_URL}")
          else
            echo "[collect.yml] PATCHGAP_SITE_URL 미설정 — run-notify.ts DEFAULT_SITE_URL(자리표시) 사용"
          fi
          npx tsx scripts/run-notify.ts \
            --from "$PATCH_FROM" \
            --to "$PATCH_TO" \
            --top 5 \
            --game lol \
            "${SITE_ARGS[@]}"
        continue-on-error: true

      - name: Commit + push generated data
        if: steps.determine.outputs.should_run == 'true'
        env:
          PATCH_FROM: ${{ steps.determine.outputs.from }}
          PATCH_TO: ${{ steps.determine.outputs.to }}
        run: |
          git config user.name "patchgap-bot"
          git config user.email "patchgap-bot@users.noreply.github.com"
          git add data/aggregated public/dd data/ddragon
          if git diff --cached --quiet; then
            echo "변경분 없음 — 커밋 생략"
          else
            git commit -m "chore(data): auto-collect ${PATCH_FROM} -> ${PATCH_TO}

            GitHub Actions collect.yml(run_id=${{ github.run_id }})가 생성."
            # [skip ci]를 넣지 않는다 — Vercel git 연동이 이 커밋을 감지해 재빌드해야 한다(PLAN ④).
            # push 경합 재시도 — 장시간 잡이 도는 동안 main에 다른 커밋(PR 머지·자매 워크플로)이
            # 들어오면 push가 `fetch first`로 거절된다. 재시도가 없던 시절 26.19 수집(5h13m)의
            # 산출물 전체가 이 한 줄에서 버려졌다(2026-09-24). 봇 커밋은 data/·public/dd만
            # 건드리므로 코드 PR과 rebase 충돌이 날 일이 드물다 — 충돌하면 그때는 멈춘다.
            for attempt in 1 2 3 4 5; do
              if git push; then break; fi
              if [ "$attempt" = 5 ]; then echo "::error::push 5회 거절"; exit 1; fi
              git pull --rebase origin main || { git rebase --abort; echo "::error::rebase 충돌 — 수동 해소 필요"; exit 1; }
              sleep $((attempt * 10))
            done
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collect-failure-logs-${{ github.run_id }}
          path: |
            logs/**
            data/aggregated/**
          if-no-files-found: ignore
          retention-days: 14
