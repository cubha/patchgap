name: collect-pubg

# PUBG 정기 수집 — 수집·축약(F1/F2) → 집계·판정(F4) → 디스코드 → 커밋·푸시.
#
# ─── 이 워크플로가 늦게 생긴 이유 ────────────────────────────────────────────────────
#
# 2026-09-20까지 PUBG는 **수집기가 TypeScript로 존재하지 않는 유일한 게임**이었다. 재현 스크립트가
# Python(`docs/plan/provenance/2026-09-16-pubg-harvest/`)이라 SCOPE §3의 스택 고정(TypeScript/Node)
# 밖이었고, 사람이 손으로 돌렸다. 그 축을 `src/pipeline/collect/pubg/`로 이식하면서 CI에 얹는다.
# 이식본이 Python과 **같은 값을 내는지**는 실전 매치 1건 전수 비교(19개 필드 일치)와 크로스 언어
# 골든 테스트가 고정한다(`collect/pubg/__tests__/telemetry-reduce.test.ts`).
#
# ─── ⏳ 336시간이 일정을 지배한다 ───────────────────────────────────────────────────
#
# 텔레메트리는 매치 생성 후 14일이면 CDN에서 사라진다. 비교 구간이 `patch-5 … patch+6`이므로
# **수집 가능 구간은 `patch+7 … patch+9` 사흘뿐**이다(계산은 patch-calendar.ts 헤더). 그래서
# 주 1회 고정 요일이 아니라 **매일** 돌고, `determine`이 그 사흘을 고른다. 놓치면 그 패치쌍은
# 영영 만들 수 없다 — 다시 받을 방법이 없기 때문이다.
#
# ─── 패치노트는 수기 입력이다 ────────────────────────────────────────────────────────
#
# PUBG 공지에는 LoL·TFT 같은 구조화 마크업이 없어 파서가 없다. `notes-{to}.json`이 없으면
# `determine`이 `notes_ready=false`를 내고 **수집만** 돈다(축약본은 캐시에 남는다). 노트를 넣은 뒤
# `gh workflow run collect-pubg.yml -f force=true`로 집계를 마저 돌린다. 이 사실을 숨기지 않는 이유:
# 조용히 스킵하면 "정기 수집이 돌고 있다"는 착각이 남는다.
#
# ─── ⚠️ concurrency 그룹을 collect.yml·collect-tft.yml과 공유한다 ──────────────────
#
# PUBG는 Riot 리밋을 나눠 쓰지 않으므로 **API 때문이 아니다**. 이유는 **git push**다 — 세 워크플로가
# 전부 같은 브랜치에 `data/aggregated/**`를 커밋하므로, 동시에 끝나면 한쪽 push가 non-fast-forward로
# 거부된다. 그 실패는 "수집은 됐는데 배포는 안 된" 상태를 남긴다.
#
# 필요 secrets: PUBG_API_KEY(필수) · ANTHROPIC_API_KEY(선택 — 없으면 원인 추정만 생략) · DISCORD_WEBHOOK_URL_PUBG(선택) · DISCORD_ROLE_ID_PUBG(선택)
# 필요 variables: PATCHGAP_SITE_URL

on:
  workflow_dispatch:
    inputs:
      per_day:
        description: "날짜당 수집 매치 수(run-pubg-collect --per-day)"
        required: false
        default: "120"
        type: string
      force:
        description: "true면 산출물이 이미 있어도, 보존창을 벗어났어도 재실행한다"
        required: false
        default: "false"
        type: boolean

  schedule:
    # 매일 20:00 UTC(05:00 KST). LoL 21:00·TFT 21:00과 한 시간 띄워 동시 큐 진입을 줄인다.
    - cron: "0 20 * * *"

concurrency:
  # 🔴 collect.yml:83 · collect-tft.yml과 동일해야 한다. 위 헤더 「concurrency」 절 참고.
  group: patchgap-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect-pubg:
    runs-on: ubuntu-latest
    # 텔레메트리가 매치당 16~30MB다. 10일 × 120건 = 1,200건이면 다운로드만 20GB 규모라
    # 동시성 8로도 한 시간을 넘길 수 있다.
    timeout-minutes: 180
    env:
      # **시크릿 값은 job-level에 두지 않는다**(2026-09-21, security-auditor Warning #2).
      # job-level env는 `npm ci`를 포함한 모든 스텝에 상속된다 — 의존성의 postinstall 스크립트가
      # 키를 읽을 수 있는 자리다. 값은 그 값을 실제로 쓰는 스텝의 `env:`에만 내려 둔다.
      #
      # 여기 남는 것은 **존재 여부 불리언 하나**다. 조건부 스텝이 `secrets` 컨텍스트를 직접 못
      # 읽기 때문이다(스텝 `if:`에서 `secrets`는 사용 불가 — `env`는 가능). 렌더된 값은 문자열
      # "true"/"false"라 시크릿이 아니고, 스텝 `env:`는 job-level을 **덮어쓰지 않고 병합**하므로
      # 값을 내려받은 스텝에서도 이 플래그는 그대로 보인다.
      HAS_DISCORD_PUBG: ${{ secrets.DISCORD_WEBHOOK_URL_PUBG != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 판정 규칙은 `src/pipeline/collect/pubg/patch-calendar.ts`(순수 함수·단위 테스트)가 갖는다.
      # 이 스텝은 그것을 부르는 얇은 진입점이다 — 실파일이라 tsc·eslint·vitest가 전부 본다.
      # 출력(2026-09-28, C13·C14): `mode` = skip | declaration | observation. 선언 계획은 수기 노트가 들어온
      # 즉시 관측 stub(`deltas.json`)을 커밋해 노트를 화면에 올린다 — 전에는 비교 구간이 닫힐 때(패치+7일)까지
      # 실행 전체가 스킵돼 노트가 일주일간 안 보였다(결정 8). 관측(수확 창)은 규칙 그대로다.
      - name: Determine patch pair (캘린더 + 보존창 + 중복 가드)
        id: determine
        env:
          # 키 미설정이면 판정 자체를 `should_run=false`로 접는다(pubg-determine.ts:48) —
          # 그래서 이 스텝에도 키가 필요하다. 값을 읽지 않고 **존재만** 본다.
          PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
          MANUAL_FORCE: ${{ github.event.inputs.force }}
        run: npx tsx scripts/pubg-determine.ts

      # 축약본은 매치당 ~3KB라 1,200건이 4MB다 — 캐시에 올려 두면 노트가 늦게 들어와도
      # (위 헤더 참고) 다시 받지 않고 집계만 돌릴 수 있다. 원본 텔레메트리는 저장하지 않는다.
      - name: Restore data/raw/pubg (축약본 재사용)
        if: steps.determine.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: data/raw/pubg
          key: patchgap-pubg-raw-${{ steps.determine.outputs.to }}-${{ github.run_id }}
          restore-keys: |
            patchgap-pubg-raw-${{ steps.determine.outputs.to }}-
            patchgap-pubg-raw-

      - name: Collect + reduce telemetry (F1/F2)
        if: steps.determine.outputs.should_run == 'true'
        env:
          # 샘플·매치 조회가 이 키로 나간다(run-pubg-collect.ts:80에서 없으면 던진다).
          # 텔레메트리 CDN 요청에는 붙지 않는다 — api.ts가 호스트 허용목록을 걸고 무인증으로 보낸다.
          PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
          DAYS: ${{ steps.determine.outputs.days }}
          PER_DAY: ${{ github.event.inputs.per_day || '120' }}
        run: npx tsx scripts/run-pubg-collect.ts --days "$DAYS" --per-day "$PER_DAY"

      # 표본 경보 — **막지 않는다**(2026-09-27, LoL #55·TFT와 동형). 전에는 official 매치 800 미만이면
      # 집계·브리핑·커밋을 전부 보류했는데, 그 커밋이 새 패치 쌍의 산출물이고 화면은 그 쌍의 노트를 보여준다
      # — 표본(관측 축)이 선언 축을 인질로 잡는 구조였다(사용자 확정 8). 표본이 얇은 무기는 판정기가
      # 개체 단위로 거른다(`PICKUP_MIN_N`=300 미만이면 insufficient-sample, pubg-delta.ts).
      # 실측 기준선 42.3=1,715 / 43.1=1,614매치 — 그 절반 800을 경보선으로 둔다.
      - name: Sample size alert
        id: sample_guard
        if: steps.determine.outputs.should_run == 'true' && steps.determine.outputs.notes_ready == 'true'
        env:
          DAYS: ${{ steps.determine.outputs.days }}
          TEL_FROM: ${{ steps.determine.outputs.telemetry_from }}
          TEL_TO: ${{ steps.determine.outputs.telemetry_to }}
        run: |
          # 날짜 목록은 workflow 입력이 아니라 determine 산출이지만, JS 리터럴에 꿰매지 않는
          # 규약은 그대로 지킨다(collect.yml·collect-tft.yml과 같은 이유). process.env로 넘긴다.
          # 텔레메트리 라벨도 determine이 준다 — 여기 박아 두면 다음 패치에서 이 한 줄만
          # 갱신을 놓쳐 표본이 조용히 0/0으로 세어진다(2026-09-21 지적).
          COUNT='const fs=require("fs");const days=new Set(process.env.DAYS.split(","));
          const dir="data/raw/pubg/telemetry-reduced";
          let before=0, after=0;
          for (const f of fs.readdirSync(dir)) {
            const j=JSON.parse(fs.readFileSync(dir+"/"+f,"utf8"));
            if (j.matchType!=="official" || !j.createdAt) continue;
            if (!days.has(j.createdAt.slice(0,10))) continue;
            if (j.patch===process.env.TEL_FROM) before++; else if (j.patch===process.env.TEL_TO) after++;
          }
          console.log(before+" "+after);'
          read -r BEFORE AFTER < <(node -e "$COUNT")
          echo "[sample_guard] official 매치 before=${BEFORE} after=${AFTER}"
          if ! [[ "$BEFORE" =~ ^[0-9]+$ && "$AFTER" =~ ^[0-9]+$ ]]; then
            echo "::error::축약본 표본을 숫자로 세지 못했다(got '${BEFORE}' '${AFTER}')"
            exit 1
          fi
          if [ "$BEFORE" -lt 800 ] || [ "$AFTER" -lt 800 ]; then
            echo "::warning::PUBG official 매치 표본이 얇다(800 미만). 노트와 판정은 그대로 반영하고, 획득 300 미만 무기는 표본 부족으로 판정된다. 축약본은 캐시에 남아 다음 실행이 이어 받는다."
          fi

      - name: Aggregate + verdict (F2/F4)
        if: steps.determine.outputs.should_run == 'true' && steps.determine.outputs.notes_ready == 'true'
        env:
          PATCH_FROM: ${{ steps.determine.outputs.from }}
          PATCH_TO: ${{ steps.determine.outputs.to }}
        run: npx tsx scripts/run-pubg-aggregate.ts --from "$PATCH_FROM" --to "$PATCH_TO"

      # 수치 축(F9) — PUBG는 게임사가 수치 파일을 내지 않으므로 축약본의 **피해 격자**를 패치 간
      # 대조한다(`run-gamedata-diff` runPubg). 버전 인자가 없는 유일한 게임이다 — 격자는 패치
      # 라벨로 직접 묶인다.
      #
      # 게이트가 `notes_ready == 'true'`를 포함해야 한다: 이 단계가 `notes-{to}.json`을 읽고,
      # 없으면 던진다(노트는 수기 입력이라 며칠 늦게 들어온다 — 위 헤더 참고). `continue-on-error`는
      # LoL·TFT와 같은 이유다.
      # LLM 2단(원인 추정) — 2026-09-27 전까지 CI에 없었다. `run-pubg-aggregate`가 `deltas.json`을 새로
      # 쓰므로, 이 스텝이 없으면 다음 패치부터 원인이 전부 사라지고 화면은 회색만 남는다(LoL·TFT는 판정
      # 스텝 안에서 돈다). 키가 없거나 실패해도 판정·커밋은 계속한다 — 원인은 얹는 축이다.
      - name: Restore data/cache/llm (LLM 2단 파일 캐시)
        if: steps.determine.outputs.should_run == 'true' && steps.determine.outputs.notes_ready == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/cache/llm
          key: patchgap-llm-pubg-${{ steps.determine.outputs.to }}-${{ github.run_id }}
          restore-keys: |
            patchgap-llm-pubg-${{ steps.determine.outputs.to }}-
            patchgap-llm-pubg-

      - name: LLM causes (F4 2단)
        if: steps.determine.outputs.should_run == 'true' && steps.determine.outputs.notes_ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 실제 호출 opt-in(2026-09-29 호출 정책) — 없으면 엔진은 캐시 전용이라 미스가 있으면 견적과 함께 멈춘다.
          PATCHGAP_LLM: "1"
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "[pubg-llm] ANTHROPIC_API_KEY 없음 — 원인 추정 생략(화면은 회색)"
            exit 0
          fi
          npx tsx scripts/run-pubg-llm.ts
        continue-on-error: true

      # LLM 캐시는 **호출 직후 무조건** 저장한다(2026-09-29). 암묵 post 저장은 잡이 성공해야만 돌아, run 35944265345가
      # LLM 133건을 산 뒤 커밋 단계에서 실패하자 결과가 버려지고 같은 날 재실행이 같은 133건을 다시 샀다(raw 캐시와 같은 규약).
      # 장기 보존은 git이다(data/cache/llm 커밋 — actions 캐시는 7일 미접근 시 지워진다).
      - name: Save data/cache/llm (LLM 호출 직후)
        if: always() && steps.determine.outputs.should_run == 'true' && steps.determine.outputs.notes_ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/cache/llm
          key: patchgap-llm-pubg-${{ steps.determine.outputs.to }}-${{ github.run_id }}

      - name: Detect submarine patches (F9)
        if: steps.determine.outputs.mode == 'declaration' || (steps.determine.outputs.should_run == 'true' && steps.determine.outputs.notes_ready == 'true')
        env:
          PATCH_FROM: ${{ steps.determine.outputs.from }}
          PATCH_TO: ${{ steps.determine.outputs.to }}
        run: |
          npx tsx scripts/run-gamedata-diff.ts \
            --game pubg \
            --from "$PATCH_FROM" \
            --to "$PATCH_TO"
        continue-on-error: true

      - name: Discord briefing (PUBG 채널)
        if: steps.determine.outputs.should_run == 'true' && steps.determine.outputs.notes_ready == 'true' && env.HAS_DISCORD_PUBG == 'true'
        env:
          DISCORD_WEBHOOK_URL_PUBG: ${{ secrets.DISCORD_WEBHOOK_URL_PUBG }}
          DISCORD_ROLE_ID_PUBG: ${{ secrets.DISCORD_ROLE_ID_PUBG }}
          SITE_URL: ${{ vars.PATCHGAP_SITE_URL }}
          PATCH_FROM: ${{ steps.determine.outputs.from }}
          PATCH_TO: ${{ steps.determine.outputs.to }}
        run: |
          set -e
          SITE_ARGS=()
          if [[ -n "${SITE_URL}" ]]; then
            SITE_ARGS=(--site "${SITE_URL}")
          fi
          # `--game pubg`는 채널과 데이터 경로를 함께 고른다. run-notify가 deltas.json의
          # meta.from/to가 인자와 다르면 **던진다** — 같은 내용이 재전송되는 것을 막는 가드다.
          npx tsx scripts/run-notify.ts \
            --from "$PATCH_FROM" \
            --to "$PATCH_TO" \
            --top 5 \
            --game pubg \
            "${SITE_ARGS[@]}"
        continue-on-error: true

      # 관측 stub(C14) — collect-tft.yml의 같은 스텝 주석 참고. PUBG는 `deltas.json`이 한 파일이라 이전 쌍의
      # 관측을 새 쌍의 stub이 대신한다(화면은 최신 쌍의 노트를 보여준다). 같은 쌍의 실제 관측은 덮지 않는다.
      - name: Observation stub (선언 축만)
        if: steps.determine.outputs.mode == 'declaration'
        env:
          PATCH_FROM: ${{ steps.determine.outputs.from }}
          PATCH_TO: ${{ steps.determine.outputs.to }}
          STUB_REASON: ${{ steps.determine.outputs.stub_reason }}
        run: npx tsx scripts/write-observation-stub.ts --game pubg --from "$PATCH_FROM" --to "$PATCH_TO" --reason "$STUB_REASON"

      # 관측이 죽으면(C14) 관측 산출물을 되돌리고 선언 축(stub)만 커밋한다 — 잡은 빨간 X로 남는다.
      - name: Observation crashed → declaration stub
        id: crash_stub
        if: failure() && steps.determine.outputs.mode == 'observation' && steps.determine.outputs.notes_ready == 'true'
        env:
          PATCH_FROM: ${{ steps.determine.outputs.from }}
          PATCH_TO: ${{ steps.determine.outputs.to }}
        run: |
          git restore --source=HEAD --staged --worktree data/aggregated/pubg data/aggregated/gamedata/pubg
          git clean -fdq data/aggregated/pubg data/aggregated/gamedata/pubg
          npx tsx scripts/write-observation-stub.ts --game pubg --from "$PATCH_FROM" --to "$PATCH_TO" --reason crashed --detail "run ${{ github.run_id }}"

      # 데이터 불변식 — **경보형**(2026-09-27). collect-tft.yml의 같은 스텝 주석 참고(봇 push는 CI를
      # 트리거하지 않는다 · 차단형이면 선언 축을 다시 인질로 잡는다).
      - name: Data invariants (경보 — 커밋은 막지 않는다)
        id: invariants
        if: ${{ !cancelled() && (steps.determine.outputs.mode == 'declaration' || steps.determine.outputs.notes_ready == 'true') && (success() || steps.crash_stub.outcome == 'success') }}
        run: |
          LOG="$RUNNER_TEMP/invariants.log"
          if npx vitest run --reporter=dot > "$LOG" 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            tail -60 "$LOG"
            echo "::warning::데이터 불변식 실패 — 커밋은 진행한다(선언 축 최신 유지). 코드 PR로 고친다."
            { echo "## ⚠️ 데이터 불변식 실패 (collect-pubg)"; echo '```'; tail -40 "$LOG"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Discord invariants alert (불변식 실패 시)
        if: ${{ !cancelled() && steps.invariants.outputs.ok == 'false' && env.HAS_DISCORD_PUBG == 'true' }}
        env:
          PATCH_TO: ${{ steps.determine.outputs.to }}
          DISCORD_WEBHOOK_URL_PUBG: ${{ secrets.DISCORD_WEBHOOK_URL_PUBG }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(node -e "console.log(JSON.stringify({content: \`⚠️ patchgap collect-pubg: \${process.env.PATCH_TO} 산출물이 데이터 불변식을 통과하지 못했습니다. 커밋은 진행했습니다 — 실행 요약: \${process.env.RUN_URL}\`}))")
          curl -sf -X POST "$DISCORD_WEBHOOK_URL_PUBG" -H "Content-Type: application/json" -d "$BODY"
        continue-on-error: true

      - name: Commit + push generated data
        if: ${{ !cancelled() && (steps.determine.outputs.mode == 'declaration' || steps.determine.outputs.notes_ready == 'true') && (success() || steps.crash_stub.outcome == 'success') }}
        env:
          MODE: ${{ steps.crash_stub.outcome == 'success' && 'declaration after crash' || steps.determine.outputs.mode }}
          PATCH_FROM: ${{ steps.determine.outputs.from }}
          PATCH_TO: ${{ steps.determine.outputs.to }}
        run: |
          git config user.name "patchgap-bot"
          git config user.email "patchgap-bot@users.noreply.github.com"
          # PUBG 네임스페이스만 건드린다 — LoL·TFT 산출물은 이 워크플로의 소관이 아니다.
          # `data/raw/pubg`는 gitignore라 add 대상에 들어오지 않는다.
          git add data/aggregated/pubg data/aggregated/gamedata/pubg data/cache/llm
          if git diff --cached --quiet; then
            echo "변경분 없음 — 커밋 생략"
          else
            git commit -m "chore(data): auto-collect pubg ${PATCH_FROM} -> ${PATCH_TO} (${MODE})

            GitHub Actions collect-pubg.yml(run_id=${{ github.run_id }})가 생성."
            # [skip ci]를 넣지 않는다 — Vercel이 이 커밋을 감지해 재빌드해야 한다.
            # push 경합 재시도 — 장시간 잡이 도는 동안 main에 다른 커밋(PR 머지·자매 워크플로)이
            # 들어오면 push가 `fetch first`로 거절된다. 재시도가 없던 시절 26.19 수집(5h13m)의
            # 산출물 전체가 이 한 줄에서 버려졌다(2026-09-24). 봇 커밋은 data/·public/dd만
            # 건드리므로 코드 PR과 rebase 충돌이 날 일이 드물다 — 충돌하면 그때는 멈춘다.
            for attempt in 1 2 3 4 5; do
              if git push; then break; fi
              if [ "$attempt" = 5 ]; then echo "::error::push 5회 거절"; exit 1; fi
              git pull --rebase origin main || { git rebase --abort; echo "::error::rebase 충돌 — 수동 해소 필요"; exit 1; }
              sleep $((attempt * 10))
            done
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collect-pubg-failure-logs-${{ github.run_id }}
          path: |
            logs/**
            data/aggregated/pubg/**
          if-no-files-found: ignore
          retention-days: 14
